<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>История колледжа в AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #start {
      position: fixed; inset: 0; z-index: 20; background: #1b2a49; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    #start button { font-size: 20px; padding: 14px 28px; border: 0; border-radius: 10px; margin-top: 20px; }
    #start .hint { font-size: 14px; opacity: 0.7; margin-top: 24px; max-width: 320px; }
  </style>
</head>
<body>

<div id="start">
  <h2>История нашего колледжа</h2>
  <p>Нажмите «Начать» и наведите камеру на афишу</p>
  <button id="startBtn">Начать</button>
  <p class="hint">Если камера не включается, откройте эту страницу в Chrome или Safari.</p>
</div>

<audio id="voice" src="story.mp3" preload="auto"></audio>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes; filterMinCF: 0.001; filterBeta: 1000; missTolerance: 5; warmupTolerance: 5;"
  color-space="sRGB"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="char" src="./Talking.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Свет, чтобы модель не выглядела тёмной -->
  <a-light type="ambient" intensity="1.2"></a-light>
  <a-light type="directional" position="0 1 1" intensity="1"></a-light>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-gltf-model id="mascot" src="#char"
                  position="0 -0.4 0"
                  scale="0.2 0.2 0.2"
                  animation-mixer="loop: repeat; timeScale: 0">
    </a-gltf-model>
  </a-entity>
</a-scene>

<script>
  const scene        = document.querySelector('a-scene');
  const target       = document.getElementById('target');
  const mascot       = document.getElementById('mascot');
  const audio        = document.getElementById('voice');
  const startOverlay = document.getElementById('start');

  // Запуск/остановка анимации вместе со звуком
  const setAnim = (speed) => mascot.setAttribute('animation-mixer', 'timeScale', speed);

  document.getElementById('startBtn').onclick = async () => {
    // "разблокируем" звук жестом пользователя
    audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(() => {});
    startOverlay.style.display = 'none';
    try {
      await scene.systems['mindar-image-system'].start();
    } catch (e) {
      console.error(e);
      startOverlay.style.display = 'flex';
      alert('Не удалось включить камеру. Разрешите доступ к камере и откройте страницу в Chrome или Safari.');
    }
  };

  target.addEventListener('targetFound', () => { audio.play(); setAnim(1); });
  target.addEventListener('targetLost',  () => { audio.pause(); setAnim(0); });

  // Когда рассказ закончился, маскот замолкает
  audio.addEventListener('ended', () => setAnim(0));
</script>

</body>
</html>
